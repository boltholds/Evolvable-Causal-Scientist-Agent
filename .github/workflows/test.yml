name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install VARIO R runtime dependencies
        run: |
          Rscript -e 'install.packages(c("rlist","combinat","dplyr","car"), repos="https://packagemanager.posit.co/cran/__linux__/noble/latest")'
      - name: Install
        run: pip install -e '.[test,bcs,bocpd,dreamcoder,mlmd]'
      - name: Test
        run: pytest -q
