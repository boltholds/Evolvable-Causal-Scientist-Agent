name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomous-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install autonomous benchmark dependencies
        run: pip install -e '.[test,mlmd,discoveryworld]'
      - name: Test autonomous DiscoveryWorld path
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          pytest -q \
            tests/test_discoveryworld_environment.py \
            tests/test_discoveryworld_generic_evidence.py \
            tests/test_discoveryworld_generic_bridge.py \
            tests/test_discoveryworld_autonomous_policy.py

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install VARIO R runtime dependencies
        run: |
          Rscript -e 'install.packages(c("rlist","combinat","dplyr","car"), repos="https://packagemanager.posit.co/cran/__linux__/noble/latest")'
      - name: Install
        run: pip install -e '.[test,bcs,bocpd,dreamcoder,mlmd,discoveryworld]'
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: pytest -q
