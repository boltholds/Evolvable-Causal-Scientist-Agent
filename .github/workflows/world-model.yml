name: world-model

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: world-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  world-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[test,world-model-planning]'
      - name: Test world model
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          patterns = (
              "test_world_model_*.py",
              "test_world_contract_*.py",
              "test_autonomous_scientist.py",
          )
          files = sorted({
              path
              for pattern in patterns
              for path in Path("tests").glob(pattern)
          })
          if not files:
              raise SystemExit("No world-model tests found")
          subprocess.run(
              [sys.executable, "-m", "pytest", "-q", *map(str, files)],
              check=True,
          )
          PY
