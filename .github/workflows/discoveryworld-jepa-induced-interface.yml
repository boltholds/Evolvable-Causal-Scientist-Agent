name: discoveryworld-jepa-induced-interface
on:
  push:
    paths:
      - 'src/ecsa/benchmarks/discoveryworld/interface_induction.py'
      - 'src/ecsa/benchmarks/discoveryworld/jepa_probe.py'
      - 'tests/test_discoveryworld_interface_induction.py'
      - 'tests/test_discoveryworld_probe_v2.py'
      - '.github/workflows/discoveryworld-jepa-induced-interface.yml'
  pull_request:
    paths:
      - 'src/ecsa/benchmarks/discoveryworld/interface_induction.py'
      - 'src/ecsa/benchmarks/discoveryworld/jepa_probe.py'
      - 'tests/test_discoveryworld_interface_induction.py'
      - 'tests/test_discoveryworld_probe_v2.py'
      - '.github/workflows/discoveryworld-jepa-induced-interface.yml'
  workflow_dispatch:

jobs:
  source-blind-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU Torch
        run: pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Install ECSA tests
        run: pip install -e '.[test,neural-relations]'
      - name: Test source-blind interface and observability diagnostics
        run: python -m pytest -q tests/test_discoveryworld_interface_induction.py tests/test_discoveryworld_probe_v2.py tests/test_discoveryworld_jepa_probe.py
