name: neural-jepa-mechanism-router

on:
  push:
    branches: [main]
    paths:
      - 'src/ecsa/experimental/jepa_mechanism_router.py'
      - 'src/ecsa/experimental/jepa_router_world.py'
      - 'src/ecsa/experimental/jepa_router_arena.py'
      - 'scripts/benchmarks/run_jepa_router.py'
      - 'tests/test_jepa_mechanism_router.py'
      - 'tests/test_jepa_router_arena.py'
      - '.github/workflows/neural-jepa-mechanism-router.yml'
  pull_request:
    paths:
      - 'src/ecsa/experimental/jepa_mechanism_router.py'
      - 'src/ecsa/experimental/jepa_router_world.py'
      - 'src/ecsa/experimental/jepa_router_arena.py'
      - 'scripts/benchmarks/run_jepa_router.py'
      - 'tests/test_jepa_mechanism_router.py'
      - 'tests/test_jepa_router_arena.py'
      - '.github/workflows/neural-jepa-mechanism-router.yml'
  workflow_dispatch:

jobs:
  router-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyTorch CPU
        run: python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project neural tests and existing BOCPD extra
        run: python -m pip install -e '.[test,neural-relations,bocpd]'
      - name: Router, prior JEPA and continual-memory tests
        run: |
          python -m pytest -q \
            tests/test_jepa_mechanism_router.py \
            tests/test_jepa_router_arena.py \
            tests/test_action_jepa.py \
            tests/test_jepa_shift.py \
            tests/test_jepa_adaptation.py
      - name: Run reproducible CPU smoke
        run: |
          python scripts/benchmarks/run_jepa_router.py \
            --mode smoke --device cpu --seed 14 \
            --output results/jepa_router_ci_smoke.json
      - name: Verify gated promotion metadata and finite metrics
        run: |
          python - <<'PY'
          import json
          d=json.load(open('results/jepa_router_ci_smoke.json'))
          assert d['protocol']=='jepa_mechanism_router_v1'
          assert d['source_labels_used_by_router'] is False
          assert len(d['phases'])==6
          assert d['interventions']['total_active_actions']>=0
          for entry in d['novelty']['attempts']:
              assert entry['result']['evidence_count']>=24
              assert entry['result']['candidate_mse']>=0
              assert entry['result']['best_existing_mse']>=0
          print('Router smoke contract validated')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jepa-router-cpu-${{ github.sha }}
          path: results/jepa_router_ci_smoke.json
          if-no-files-found: ignore
