name: native-world-model-verify

on:
  push:
    branches: [feat/world-model-acquisition-verify]

concurrency:
  group: native-world-model-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install VARIO R runtime dependencies
        run: |
          Rscript -e 'install.packages(c("rlist","combinat","dplyr","car"), repos="https://packagemanager.posit.co/cran/__linux__/noble/latest")'
      - name: Install
        run: pip install -e '.[test,bcs,bocpd,dreamcoder,mlmd,discoveryworld]'
      - name: Full suite
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: pytest -q

  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[test,world-model-planning]'
      - name: MAcq tests
        run: pytest -q tests/test_world_model_macq.py
