name: universal-causal-core
on:
  push:
    branches:
      - 'feat/universal-*'
    paths:
      - 'src/ecsa/world_model/**'
      - 'src/ecsa/autonomy/scientist.py'
      - 'tests/test_learning_progress.py'
      - 'tests/test_progress_selection.py'
      - 'tests/test_scientist_learning_progress.py'
      - 'tests/test_generic_learning_progress_arena.py'
      - '.github/workflows/universal-causal-core.yml'
  pull_request:
    paths:
      - 'src/ecsa/world_model/**'
      - 'src/ecsa/autonomy/scientist.py'
      - 'tests/test_learning_progress.py'
      - 'tests/test_progress_selection.py'
      - 'tests/test_scientist_learning_progress.py'
      - 'tests/test_generic_learning_progress_arena.py'
      - '.github/workflows/universal-causal-core.yml'
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core test dependencies
        run: pip install -e '.[test]'
      - name: Universal learning progress and regression checks
        run: |
          python -m pytest -q \
            tests/test_learning_progress.py \
            tests/test_progress_selection.py \
            tests/test_scientist_learning_progress.py \
            tests/test_generic_learning_progress_arena.py \
            tests/test_world_model_experiments.py \
            tests/test_autonomous_scientist.py
