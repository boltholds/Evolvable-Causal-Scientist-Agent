name: universal-causal-core
on:
  push:
    branches:
      - 'feat/universal-*'
    paths:
      - 'src/ecsa/world_model/**'
      - 'src/ecsa/autonomy/scientist.py'
      - 'tests/test_learning_progress.py'
      - 'tests/test_progress_selection.py'
      - 'tests/test_scientist_learning_progress.py'
      - 'tests/test_generic_learning_progress_arena.py'
      - 'tests/test_effect_attribution_*.py'
      - 'tests/test_scientist_effect_attribution.py'
      - 'tests/test_shared_*.py'
      - 'tests/test_discoveryworld_shared_probe.py'
      - '.github/workflows/universal-causal-core.yml'
  pull_request:
    paths:
      - 'src/ecsa/world_model/**'
      - 'src/ecsa/autonomy/scientist.py'
      - 'tests/test_learning_progress.py'
      - 'tests/test_progress_selection.py'
      - 'tests/test_scientist_learning_progress.py'
      - 'tests/test_generic_learning_progress_arena.py'
      - 'tests/test_effect_attribution_*.py'
      - 'tests/test_scientist_effect_attribution.py'
      - 'tests/test_shared_*.py'
      - 'tests/test_discoveryworld_shared_probe.py'
      - '.github/workflows/universal-causal-core.yml'
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core test dependencies
        run: pip install -e '.[test]' 'numpy>=1.26,<3'
      - name: Universal learning progress and regression checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          paths = [Path("tests") / name for name in (
              "test_learning_progress.py", "test_progress_selection.py",
              "test_scientist_learning_progress.py", "test_generic_learning_progress_arena.py",
              "test_world_model_experiments.py", "test_autonomous_scientist.py",
              "test_effect_attribution_projection.py", "test_effect_attribution_hypotheses.py",
              "test_effect_attribution_interventions.py", "test_scientist_effect_attribution.py",
              "test_shared_outcome_frame.py", "test_shared_predictive_adapters.py",
              "test_shared_scoring.py", "test_shared_scoring_two_domains.py",
              "test_discoveryworld_shared_probe.py",
          )]
          present = [str(p) for p in paths if p.exists()]
          raise SystemExit(subprocess.call([sys.executable, "-m", "pytest", "-q", *present]))
          PY
