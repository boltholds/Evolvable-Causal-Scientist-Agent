name: active-experiment-scheduler-arena

on:
  push:
    branches: [feat/generic-active-experiment-scheduler]

concurrency:
  group: active-experiment-scheduler-arena
  cancel-in-progress: true

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[test,discoveryworld]'
      - name: Run 12-step Arena B diagnostic
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python - <<'PY'
          import json
          from collections import Counter

          from ecsa.autonomy.scientist import AutonomousScientist
          from ecsa.benchmarks.discoveryworld.perception import DiscoveryWorldStructuredDecoder
          from ecsa.benchmarks.discoveryworld.raw_environment import DiscoveryWorldRawEnvironment
          from ecsa.world_model.canonical import canonicalize_world_contract
          from ecsa.world_model.contracts import InteractionTransition, freeze_raw_value
          from ecsa.world_model.experiments import ContractExperimentCoordinator, ExperimentBudget
          from ecsa.world_model.kernel import WorldModelAcquisitionKernel
          from ecsa.world_model.learners.locm2 import Locm2Learner
          from ecsa.world_model.perception.structured import StructuredObservationFrontend

          environment = DiscoveryWorldRawEnvironment.reactor_lab_normal(
              0,
              max_steps=12,
          )
          world_model = WorldModelAcquisitionKernel(
              learners=(Locm2Learner(),),
          )
          coordinator = ContractExperimentCoordinator()
          scientist = AutonomousScientist(
              world_model=world_model,
              experiments=coordinator,
              perception=StructuredObservationFrontend(
                  DiscoveryWorldStructuredDecoder()
              ),
          )
          budget = ExperimentBudget(max_ground_actions=64)
          chosen = Counter()
          successes = Counter()
          failures = Counter()

          transitions = 0
          while not environment.done and environment.steps < 12:
              before = environment.observe_raw()
              experiment = scientist.choose_experiment(
                  observation=before,
                  actions=environment.list_raw_actions(),
                  goal=freeze_raw_value(
                      {"public_observation": before.payload.thaw()}
                  ),
                  budget=budget,
              )
              chosen[experiment.action.schema_id] += 1
              outcome = environment.execute_raw_action(experiment.action)
              (successes if outcome.success else failures)[
                  experiment.action.schema_id
              ] += 1
              after = environment.observe_raw()
              scientist.observe_transition(
                  InteractionTransition(
                      transition_id=f"t:{transitions}",
                      before=before,
                      action=experiment.action,
                      outcome=outcome,
                      after=after,
                  )
              )
              transitions += 1

          contracts = world_model.contract_hypotheses()
          result = {
              "steps": environment.steps,
              "transitions": transitions,
              "chosen_actions": dict(chosen),
              "successful_actions": dict(successes),
              "failed_actions": dict(failures),
              "contract_count": len(contracts),
              "contract_fingerprints": [
                  canonicalize_world_contract(contract).fingerprint
                  for contract in contracts
              ],
          }
          print("SCHEDULER_ARENA_RESULT_BEGIN")
          print(json.dumps(result, indent=2, sort_keys=True))
          print("SCHEDULER_ARENA_RESULT_END")
          assert len(chosen) > 1, result
          assert chosen.get("ACTIVATE", 0) < 12, result
          assert contracts, result
          PY
