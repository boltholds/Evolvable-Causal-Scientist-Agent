name: neural-jepa-hidden-shift

on:
  push:
    branches: [main]
    paths:
      - 'src/ecsa/experimental/jepa_shift_world.py'
      - 'src/ecsa/experimental/jepa_shift_detection.py'
      - 'src/ecsa/experimental/jepa_shift_scientist.py'
      - 'src/ecsa/experimental/jepa_shift_arena.py'
      - 'scripts/benchmarks/run_jepa_shift.py'
      - 'tests/test_jepa_shift.py'
      - 'docs/experiments/2026-10-09-jepa-hidden-shift.md'
      - '.github/workflows/neural-jepa-hidden-shift.yml'
  pull_request:
    paths:
      - 'src/ecsa/experimental/jepa_shift_world.py'
      - 'src/ecsa/experimental/jepa_shift_detection.py'
      - 'src/ecsa/experimental/jepa_shift_scientist.py'
      - 'src/ecsa/experimental/jepa_shift_arena.py'
      - 'scripts/benchmarks/run_jepa_shift.py'
      - 'tests/test_jepa_shift.py'
      - '.github/workflows/neural-jepa-hidden-shift.yml'
  workflow_dispatch:

jobs:
  shift-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Install ECSA neural and test dependencies
        run: python -m pip install -e '.[test,neural-relations]'
      - name: Verify hidden regime, permutation holdout, FPR and pretrained JEPA regression
        run: python -m pytest -q tests/test_jepa_shift.py tests/test_action_jepa.py
      - name: Run one smoke arena with null controls
        run: |
          python scripts/benchmarks/run_jepa_shift.py \
            --mode smoke --seed 3 --steps 40 \
            --output results/jepa_shift_ci.json
          python - <<'PY'
          import json
          data = json.load(open('results/jepa_shift_ci.json'))
          assert data['protocol'] == 'action_jepa_hidden_shift_v1'
          assert set(data['controls']) == {
              'jepa', 'shuffled_actions', 'random_ridge',
              'raw_ridge', 'delta_template', 'symbolic'
          }
          assert data['intervention_protocol']['pilot_and_confirm_disjoint']
          for key,row in data['controls'].items():
              assert 'null_false_alarm' in row
              if row['selected_pair'] is not None:
                  assert not set(row['pilot_evidence_ids']) & set(row['confirmation_evidence_ids'])
          print('OFFLINE PROTOCOL VERIFIED; no GPU or universal causal discovery claimed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jepa-hidden-shift-${{ github.sha }}
          path: results/jepa_shift_ci.json
          if-no-files-found: ignore
