name: active-experiment-scheduler-verify

on:
  push:
    branches: [feat/generic-active-experiment-scheduler]

concurrency:
  group: active-experiment-scheduler-verify
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[test]'
      - name: Targeted tests
        run: |
          pytest -q \
            tests/test_world_model_experiments.py \
            tests/test_autonomous_scientist.py
