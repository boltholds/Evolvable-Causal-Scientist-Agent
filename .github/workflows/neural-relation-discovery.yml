name: neural-relation-discovery

on:
  push:
    branches: [main]
    paths:
      - "src/ecsa/experimental/**"
      - "tests/test_relation_discovery.py"
      - "pyproject.toml"
      - ".github/workflows/neural-relation-discovery.yml"
  workflow_dispatch:

concurrency:
  group: neural-relation-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-neural-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: python -m pip install "torch>=2.3,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install optional benchmark dependencies
        run: python -m pip install -e '.[test,neural-relations]'
      - name: Test independent encoders and EIG
        run: python -m pytest -q tests/test_relation_discovery.py
      - name: Three-law three-seed benchmark
        run: |
          python -m ecsa.experimental.relation_discovery             --seeds 0 1 2 --steps 200             --train-pairs 128 --test-pairs 160             --active-queries 12 --active-steps 55             --output neural-relation-results/results.json
      - name: Preserve reproducible results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-encoder-kan-${{ github.sha }}
          path: neural-relation-results/
          if-no-files-found: ignore
