name: scheduler-no-vario

on:
  push:
    branches: [verify/generic-active-scheduler-no-vario]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[test,bcs,bocpd,dreamcoder,mlmd,discoveryworld,world-model-planning]'
      - name: Test everything except external VARIO integration
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: pytest -q --ignore=tests/test_vario_transfer.py
