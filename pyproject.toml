[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolvable-causal-scientist-agent"
version = "0.1.0"
description = "Scientific coordination kernel for an evolvable causal scientist agent"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
bcs = ["behavioral-causal-state @ git+https://github.com/boltholds/Behavioral-Causal-State.git@ae8d331e3a1bcac55c740e35720672c7d2bf7106"]
bocpd = ["bocd @ git+https://github.com/fiannai/bocd.git@0c09315e9102ddea885bb7164e47b61a95e99dac"]
dreamcoder = ["frozendict>=2,<3"]
mlmd = ["ml-metadata==1.21.0"]
discoveryworld = ["discoveryworld @ git+https://github.com/allenai/discoveryworld.git@fd591323920be0d3786ef350955de1945aa571e5"]
llm = ["openai>=2,<4"]
world-model-planning = ["macq==0.3.11"]
neural-relations = ["numpy>=1.26,<3", "torch>=2.3,<3"]
pretrained-encoder = ["numpy>=1.26,<3", "torch>=2.3,<3", "sentence-transformers>=4.1,<6", "transformers>=4.51,<5", "peft>=0.15,<1", "accelerate>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
