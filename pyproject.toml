[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolvable-causal-scientist-agent"
version = "0.1.0"
description = "Scientific coordination kernel for an evolvable causal scientist agent"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
bcs = ["behavioral-causal-state @ git+https://github.com/boltholds/Behavioral-Causal-State.git@ae8d331e3a1bcac55c740e35720672c7d2bf7106"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
